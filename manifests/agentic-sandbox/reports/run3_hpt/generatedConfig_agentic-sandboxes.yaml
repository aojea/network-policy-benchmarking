name: agentic-sandboxes
dependencies: []
automanagednamespaces: 0
namespace:
  number: 1
  prefix: sandboxes
  deletestalenamespaces: false
  deleteautomanagednamespaces: true
  enableexistingnamespaces: false
  deletenamespacetimeout: 600000000000
steps:
- phases:
  - namespacerange:
      min: 1
      max: 1
      basename: null
    namespacelist: []
    replicaspernamespace: 1
    tuningset: Uniform
    objectbundle:
    - basename: default-deny
      objecttemplatepath: manifests/default-deny-policy.yaml
      templatefillmap:
        ApplyDefaultDenyPolicy: true
      listunknownobjectoptions: null
  measurements: []
  module:
    path: ""
    params: {}
  name: Phase 0 - Setup Default Deny Policy
- phases:
  - namespacerange:
      min: 1
      max: 1
      basename: null
    namespacelist: []
    replicaspernamespace: 1
    tuningset: Uniform
    objectbundle:
    - basename: global-policy
      objecttemplatepath: manifests/global-sandbox-policy.yaml
      templatefillmap:
        NetworkPolicyIncludeRandomCidrRules: false
      listunknownobjectoptions: null
  measurements: []
  module:
    path: ""
    params: {}
  name: Phase 0 - Setup Global allow policy
- phases:
  - namespacerange:
      min: 1
      max: 1
      basename: null
    namespacelist: []
    replicaspernamespace: 1
    tuningset: Uniform
    objectbundle:
    - basename: gateway
      objecttemplatepath: manifests/gateway-daemon.yaml
      templatefillmap: {}
      listunknownobjectoptions: null
    - basename: gateway-service
      objecttemplatepath: manifests/gateway-service.yaml
      templatefillmap: {}
      listunknownobjectoptions: null
    - basename: gateway-policy
      objecttemplatepath: manifests/gateway-policy.yaml
      templatefillmap: {}
      listunknownobjectoptions: null
  measurements: []
  module:
    path: ""
    params: {}
  name: Phase 0 - Setup Gateway
- phases: []
  measurements:
  - method: WaitForRunningPods
    params:
      action: gather
      desiredPodCount: 2
      labelSelector: group = gateway
      timeout: 5m
    identifier: WaitForGateway
    instances: []
  module:
    path: ""
    params: {}
  name: Phase 0 - Wait for Gateway
- phases: []
  measurements:
  - method: GenericPrometheusQuery
    params:
      action: start
      dimensions:
      - protocol
      - family
      enableViolations: false
      metricName: Kube Network Policies Packet Processing Time
      metricVersion: v1
      queries:
      - name: p99_latency
        query: histogram_quantile(0.99, sum by (le, protocol, family) (rate(kube_network_policies_packet_process_time_bucket[%v])))
      - name: p90_latency
        query: histogram_quantile(0.90, sum by (le, protocol, family) (rate(kube_network_policies_packet_process_time_bucket[%v])))
      - name: p50_latency
        query: histogram_quantile(0.50, sum by (le, protocol, family) (rate(kube_network_policies_packet_process_time_bucket[%v])))
      unit: microseconds
    identifier: KubeNetworkPoliciesPacketProcessingTime
    instances: []
  - method: GenericPrometheusQuery
    params:
      action: start
      enableViolations: false
      metricName: Kube Network Policies Queue Drops Rate
      metricVersion: v1
      queries:
      - name: total_drops
        query: sum(increase(kube_network_policies_nfqueue_queue_dropped[%v]))
      - name: mean_drop_rate
        query: sum(rate(kube_network_policies_nfqueue_queue_dropped[%v]))
      unit: drops_per_second
    identifier: KubeNetworkPoliciesQueueDrops
    instances: []
  - method: GenericPrometheusQuery
    params:
      action: start
      enableViolations: false
      metricName: Kube Network Policies User Drops Rate
      metricVersion: v1
      queries:
      - name: total_user_drops
        query: sum(increase(kube_network_policies_nfqueue_user_dropped[%v]))
      - name: mean_user_drop_rate
        query: sum(rate(kube_network_policies_nfqueue_user_dropped[%v]))
      unit: drops_per_second
    identifier: KubeNetworkPoliciesUserDrops
    instances: []
  - method: GenericPrometheusQuery
    params:
      action: start
      dimensions:
      - protocol
      - family
      - verdict
      enableViolations: false
      metricName: Kube Network Policies Packet Verdicts Rate
      metricVersion: v1
      queries:
      - name: total_packets
        query: sum by (protocol, family, verdict) (increase(kube_network_policies_packet_counter[%v]))
      - name: mean_rate
        query: sum by (protocol, family, verdict) (rate(kube_network_policies_packet_counter[%v]))
      unit: packets_per_second
    identifier: KubeNetworkPoliciesPacketVerdicts
    instances: []
  - method: GenericPrometheusQuery
    params:
      action: start
      enableViolations: false
      metricName: Kube Network Policies CPU Usage
      metricVersion: v1
      queries:
      - name: max_cpu_usage
        query: max(rate(process_cpu_seconds_total{job="kube-network-policies"}[%v]))
      - name: p99_cpu_usage
        query: quantile(0.99, rate(process_cpu_seconds_total{job="kube-network-policies"}[%v]))
      - name: p50_cpu_usage
        query: quantile(0.50, rate(process_cpu_seconds_total{job="kube-network-policies"}[%v]))
      unit: cores
    identifier: KubeNetworkPoliciesCPUUsage
    instances: []
  - method: GenericPrometheusQuery
    params:
      action: start
      enableViolations: false
      metricName: Kube Network Policies Memory Usage
      metricVersion: v1
      queries:
      - name: max_memory_usage
        query: max(process_resident_memory_bytes{job="kube-network-policies"})
      - name: p99_memory_usage
        query: quantile(0.99, process_resident_memory_bytes{job="kube-network-policies"})
      - name: p50_memory_usage
        query: quantile(0.50, process_resident_memory_bytes{job="kube-network-policies"})
      unit: bytes
    identifier: KubeNetworkPoliciesMemoryUsage
    instances: []
  module:
    path: ""
    params: {}
  name: start kube-network-policies measurements
- phases: []
  measurements:
  - method: GenericPrometheusQuery
    params:
      action: start
      enableViolations: false
      metricName: DNS Lookup Latency (NodeLocalDNS)
      metricVersion: v1
      queries:
      - name: p99_latency
        query: histogram_quantile(0.99, sum by (le) (rate(node_cache_dns_request_duration_seconds_bucket[%v:1m])))
      - name: p90_latency
        query: histogram_quantile(0.90, sum by (le) (rate(node_cache_dns_request_duration_seconds_bucket[%v:1m])))
      - name: p50_latency
        query: histogram_quantile(0.50, sum by (le) (rate(node_cache_dns_request_duration_seconds_bucket[%v:1m])))
      unit: seconds
    identifier: DnsLookupLatency
    instances: []
  module:
    path: ""
    params: {}
  name: start dns measurements
- phases: []
  measurements:
  - method: SchedulingThroughput
    params:
      action: start
    identifier: TotalSchedulingThroughput
    instances: []
  - method: APIResponsivenessPrometheus
    params:
      action: start
    identifier: APIResponsivenessPrometheus
    instances: []
  - method: APIResponsivenessPrometheus
    params:
      action: start
      enableViolations: false
      summaryName: APIResponsivenessPrometheus_simple
      useSimpleLatencyQuery: true
    identifier: APIResponsivenessPrometheusSimple
    instances: []
  - method: PodStartupLatency
    params:
      action: start
      labelSelector: group = sandbox
      summaryName: TotalPodStartupLatency
      threshold: 5m
    identifier: TotalPodStartupLatency
    instances: []
  - method: GenericPrometheusQuery
    params:
      action: start
      enableViolations: false
      metricName: Sandbox Pod Density Per Node
      metricVersion: v1
      queries:
      - name: max_pods_per_node
        query: max(max_over_time((count(kube_pod_info{namespace=~"sandboxes-.*"})
          by (node)) [%v:1s]))
      - name: mean_pods_per_node
        query: avg(max_over_time((count(kube_pod_info{namespace=~"sandboxes-.*"})
          by (node)) [%v:1s]))
      - name: p99_pods_per_node
        query: quantile(0.99, max_over_time((count(kube_pod_info{namespace=~"sandboxes-.*"})
          by (node)) [%v:1s]))
      - name: p90_pods_per_node
        query: quantile(0.90, max_over_time((count(kube_pod_info{namespace=~"sandboxes-.*"})
          by (node)) [%v:1s]))
      - name: p50_pods_per_node
        query: quantile(0.50, max_over_time((count(kube_pod_info{namespace=~"sandboxes-.*"})
          by (node)) [%v:1s]))
      unit: pods_per_node
    identifier: SandboxPodDensity
    instances: []
  - method: GenericPrometheusQuery
    params:
      action: start
      enableViolations: false
      metricName: Total Pod Density Per Node
      metricVersion: v1
      queries:
      - name: max_pods_per_node
        query: max(max_over_time((count(kube_pod_info) by (node)) [%v:1s]))
      - name: mean_pods_per_node
        query: avg(max_over_time((count(kube_pod_info) by (node)) [%v:1s]))
      - name: p99_pods_per_node
        query: quantile(0.99, max_over_time((count(kube_pod_info) by (node)) [%v:1s]))
      - name: p90_pods_per_node
        query: quantile(0.90, max_over_time((count(kube_pod_info) by (node)) [%v:1s]))
      - name: p50_pods_per_node
        query: quantile(0.50, max_over_time((count(kube_pod_info) by (node)) [%v:1s]))
      unit: pods_per_node
    identifier: TotalPodDensity
    instances: []
  module:
    path: ""
    params: {}
  name: start measurements
- phases: []
