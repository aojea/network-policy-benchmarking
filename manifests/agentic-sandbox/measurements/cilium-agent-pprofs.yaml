{{$PPROF_INTERVAL := DefaultParam .CL2_PPROF_INTERVAL_SECONDS 60}}
{{$ENABLE_CILIUM_PPROF := DefaultParam .CL2_ENABLE_CILIUM_PPROF false}}

{{if eq $ENABLE_CILIUM_PPROF true}}
steps:
  - name: {{.action}} Cilium Agent PProfs
    measurements:
    - identifier: cilium-agent-PodPeriodicCommand
      method: PodPeriodicCommand
      params:
        action: {{.action}}
        labelSelector: k8s-app=cilium
        nodeSelector: "kubernetes.io/os=linux"
        interval: {{ $PPROF_INTERVAL }}s
        container: cilium-agent
        limit: 1
        failOnCommandError: false
        failOnExecError: false
        failOnTimeout: false
        commands:
        - name: cilium-pprof
          command:
          - cilium-bugtool
          - --get-pprof
          - --pprof-trace-seconds=40
          - --archiveType=gz
          - -t=-
          timeout: 180s
{{end}}
